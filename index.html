<!doctype html>

<head>

<title>泰國青年活動</title>
<style>
  :root { --bg:#faf6ef; --surface:#fff; --ink:#2a241f; --muted:#6f655b; --line:#e4dacb; --accent:#a8322d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120f; --surface:#1e1a16; --ink:#eee6da; --muted:#a89b8b; --line:#3a332b; --accent:#e0745f; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:32px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 28px; }
  a.item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
  a.item:hover { border-color:var(--accent); }
  .date { color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
</style>
</head>

</html>
